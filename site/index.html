<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>Calypso Code Quality</title>
		<meta name="description" content="Backlog of small naming and structure inconsistencies in wp-calypso’s client/dashboard." />
		<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 16 16%22%3E%3Crect width=%2216%22 height=%2216%22 rx=%224%22 fill=%22%233858e9%22/%3E%3Cpath d=%22M4 8.5l2.5 2.5L12 5%22 stroke=%22white%22 stroke-width=%222%22 fill=%22none%22/%3E%3C/svg%3E" />
		<link rel="stylesheet" href="style.css" />
	</head>
	<body>
		<header class="top">
			<div class="wrap">
				<p class="eyebrow">Calypso Code Quality · wp-calypso · <code id="root">client/dashboard</code></p>
				<h1>Conventions backlog</h1>
				<p class="meta" id="meta">Loading…</p>
				<dl class="stats" id="stats"></dl>
			</div>
		</header>

		<main class="wrap layout">
			<nav class="rail" aria-label="Conventions">
				<h2 class="rail-title">Conventions</h2>
				<ul id="conventions" class="conventions"></ul>
				<section id="prs-section" class="prs" hidden>
					<h2 class="rail-title">Pull requests</h2>
					<ul id="prs"></ul>
				</section>
			</nav>

			<section class="content">
				<div class="filters" role="search">
					<input id="q" type="search" placeholder="Filter by path or message" aria-label="Filter findings" />
					<select id="area" aria-label="Area"></select>
					<select id="status" aria-label="Status">
						<option value="active">Open &amp; in progress</option>
						<option value="open">Open</option>
						<option value="claimed">Claimed</option>
						<option value="pr">Has PR</option>
						<option value="wontfix">Won’t fix</option>
						<option value="all">All</option>
					</select>
				</div>
				<div id="detail"></div>
				<ol id="findings" class="findings"></ol>
				<p id="empty" class="empty" hidden>Nothing matches these filters.</p>
			</section>
		</main>

		<footer class="wrap foot">
			Generated by <code>ccq</code>. Ids are stable across scans; link one to a PR with
			<code>npm run track -- pr &lt;url&gt; &lt;id&gt;</code>.
		</footer>
		<script src="app.js" type="module"></script>
	</body>
</html>
